services:
  eventos:
    build:
      context: .
      args:
        SERVICE: eventos-service
    ports: ["8081:8081"]
    environment:
      SPRING_PROFILES_ACTIVE: local
    volumes: ["eventos-data:/app/data"]
  compras:
    build:
      context: .
      args:
        SERVICE: compras-service
    ports: ["8082:8082"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      EVENTOS_BASE_URL: http://eventos:8081
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      RESUMENES_DIR: /app/data/resumenes-locales
    volumes: ["compras-data:/app/data"]
volumes:
  eventos-data:
  compras-data:

