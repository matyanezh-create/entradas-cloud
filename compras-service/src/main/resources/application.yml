server:
  port: 8082
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: compras-service
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
info:
  app:
    version: ${APP_VERSION:local}
eventos.base-url: ${EVENTOS_BASE_URL:http://localhost:8081}

